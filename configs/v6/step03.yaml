schema_version: 1

v6:
  step3:
    scope: official_encot_source_runtime_adapter_and_training_smoke_no_quality_selection
    implementation_version: v6_step3_official_encot_exact_bridge_r1

    prerequisite:
      status: PASS
      readiness: READY_FOR_V6_STEP3_OFFICIAL_ENCOT_REPRODUCTION
      implementation_version: v6_step2_data_evaluator_firewall_r1
      data_key: 7774658044d3e297ed5bff31a45bcad5221228a53fe48fd5aabacebf12778c2d

    # Resolved relative to the V6 root. Only frozen development artifacts are
    # audited. Real model fitting in this stage uses the 620 training rows only.
    source_project_root: ../SC-HTM
    cities: [beijing, shanghai, xiamen]
    embedding_norm_tolerance: 0.0001

    official_source:
      method: EnCOT
      repository: https://github.com/manhdo249/EnCOT
